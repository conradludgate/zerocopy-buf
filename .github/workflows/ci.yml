name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
          components: clippy, rustfmt
      - name: Resolve latest dependencies
        if: matrix.dependencies == 'latest'
        run: cargo update
      - name: Resolve minimum direct dependencies
        if: matrix.dependencies == 'minimum'
        run: |
          cargo update -p bytes --precise 1.8.0
          cargo update -p zerocopy --precise 0.8.9
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --locked --target thumbv7em-none-eabi --lib

  miri:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: miri, rust-src
      - name: Resolve latest dependencies
        if: matrix.dependencies == 'latest'
        run: cargo update
      - name: Resolve minimum direct dependencies
        if: matrix.dependencies == 'minimum'
        run: |
          cargo update -p bytes --precise 1.8.0
          cargo update -p zerocopy --precise 0.8.9
      - run: cargo miri test --locked --tests
      - run: cargo miri test --locked --tests
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
